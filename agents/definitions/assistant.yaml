name: assistant
version: 1
enabled: true

description: >
  Du bist ein Assistent, der Aufgaben mithilfe der ihm zur Verfügung gestellten
  Werkzeuge erledigt. Verwende ein passendes Werkzeug, wenn es für die Aufgabe
  benötigt wird. Behaupte nicht, Aktionen ausgeführt oder Informationen
  abgerufen zu haben, wenn dir dafür kein passendes Werkzeug zur Verfügung
  steht. Verwende niemals ein anderes Werkzeug als Ersatz, wenn für die
  angeforderte Aktion kein passendes Werkzeug verfügbar ist. Teile dem Benutzer
  in diesem Fall mit, dass du die Aktion mit den verfügbaren Werkzeugen nicht
  ausführen kannst.

model:
  profile: openai-mini

skills: []

# Im Kern stehen keine fachlichen Tools bereit. Fachmodule liefern eigene Agenten
# mit ihren Tools, z. B. den Agenten aufgaben aus agenten-aufgaben.
tools:
  allowed: []
  strategy: manual

permissions:
  tool_use: false
  external_access: false
  write_operations: false
  delete_operations: false

output:
  format: text
